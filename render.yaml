databases:
  - name: sistema-control-db
    plan: free
    databaseName: sistema_control
    user: sistema_control

services:
  # MVP: solo web. Correos síncronos (EMAIL_USE_CELERY=False).
  # Fase 2: añadir Key Value + worker Celery y EMAIL_USE_CELERY=True
  # (ver contexto/17-integracion-resend.md).
  - type: web
    name: sistema-control-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-control-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATOS_PERSONALES_CONTACTO
        value: protecciondatos@ucundinamarca.edu.co
      - key: RESEND_MOCK_MODE
        value: "False"
      - key: EMAIL_USE_CELERY
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Control de Equipos UCundinamarca
      - key: RESEND_WEBHOOK_SECRET
        sync: false

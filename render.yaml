databases:
  - name: sistema-control-db
    plan: free
    databaseName: sistema_control
    user: sistema_control

services:
  - type: keyvalue
    name: sistema-control-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: sistema-control-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-control-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATOS_PERSONALES_CONTACTO
        value: protecciondatos@ucundinamarca.edu.co
      - key: RESEND_MOCK_MODE
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Control de Equipos UCundinamarca
      - key: RESEND_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: sistema-control-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -l warning -Q emails,celery --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-control-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: sistema-control-redis
          type: keyvalue
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RESEND_MOCK_MODE
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Control de Equipos UCundinamarca
      - key: RESEND_WEBHOOK_SECRET
        sync: false

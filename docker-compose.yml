services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sistema_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: local-docker-compose-secret-key-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: postgres://postgres:postgres@db:5432/sistema_control
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

# =============================================================================
# docker-compose.prod.yml — LOCAL / DESARROLLO
# =============================================================================
# Compose listo para correr en tu máquina (Docker Desktop).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up --build
#   docker compose -f docker-compose.prod.yml down
#
# Producción / web → docker-compose.yml (archivo canónico del servidor)
#   docker compose --env-file .env.prod up -d --build
#
# Correos en local: por defecto MOCK (no llama a Resend).
# Para envío real: en .env pon RESEND_MOCK_MODE=False + RESEND_API_KEY y recrea:
#   docker compose -f docker-compose.prod.yml up -d --force-recreate web worker
# =============================================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sistema_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      SECRET_KEY: local-docker-compose-secret-key-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DATABASE_URL: postgres://postgres:postgres@db:5432/sistema_control
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Local con worker: por defecto cola Celery. Override en .env si quieres sync.
      EMAIL_USE_CELERY: ${EMAIL_USE_CELERY:-True}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      # Mock por defecto; RESEND_MOCK_MODE=False en .env para pruebas reales
      RESEND_MOCK_MODE: ${RESEND_MOCK_MODE:-True}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Control de Equipos UCundinamarca}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "emails,celery"]
    env_file:
      - .env
    environment:
      DEBUG: "True"
      SECRET_KEY: local-docker-compose-secret-key-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@db:5432/sistema_control
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EMAIL_USE_CELERY: ${EMAIL_USE_CELERY:-True}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      RESEND_MOCK_MODE: ${RESEND_MOCK_MODE:-True}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Control de Equipos UCundinamarca}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

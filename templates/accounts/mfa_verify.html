{% extends "base.html" %}

{% block title %}Verificación MFA{% endblock %}

{% block auth_content %}
<div style="width: 100%; max-width: 420px;">
  <div class="card card-white" style="padding: 32px;">
    <h1 style="font-size: 1.25rem; font-weight: 700;">Verificación en dos pasos</h1>
    <p style="margin-top: 8px; color: var(--color-text-secondary); font-size: 0.875rem;">
      Ingrese el código de 6 dígitos de su aplicación autenticadora.
    </p>
    <form method="post" style="margin-top: 20px;">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_token">Código MFA</label>
        <input type="text" name="token" id="id_token" class="form-control"
               inputmode="numeric" autocomplete="one-time-code" maxlength="8" required
               style="font-family: var(--font-mono); letter-spacing: 0.1em;">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Verificar</button>
    </form>
  </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block title %}Restablecer contraseña{% endblock %}

{% block auth_content %}
<div style="width: 100%; max-width: 440px;">
  <div class="card card-white" style="padding: 32px var(--space-4);">
    <div style="text-align: center; margin-bottom: var(--space-4);">
      <h2 style="font-size: 1.25rem; font-weight: 700;">Restablecer contraseña</h2>
      <p style="font-size: 0.875rem; color: var(--color-text-secondary); margin-top: var(--space-2);">
        Indique su usuario, correo o documento. Si existe una cuenta, le enviaremos un enlace.
      </p>
    </div>
    <form method="post" action="{% url 'accounts:password_reset' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_identificador">Usuario, correo o documento</label>
        <input type="text" name="identificador" id="id_identificador" class="form-control" required
               autocomplete="username" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-3);">
        Enviar enlace
      </button>
    </form>
    <div style="margin-top: var(--space-3); text-align: center;">
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary" style="width: 100%;">Volver al login</a>
    </div>
  </div>
</div>
{% endblock %}
